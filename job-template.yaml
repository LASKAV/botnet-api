apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ job_name }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: botnet-account-job
          image: ghcr.io/laskav/botnet-account-job:3d9675246fd02968c3bfea68b988f421417072b6
          env:
            - name: ACCOUNT_ID
              value: "{{ account_id }}"
            - name: OWNER_ID
              value: "{{ owner_id }}"
            - name: API_URL
              value: "http://botnet-api:8080"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: INFINITE
              value: "true"
      restartPolicy: Never