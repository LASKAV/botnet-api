# EXAMPLE; Mount template to ./job-template.yaml via volume in production
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ job_name }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: botnet-account-job
          image: ghcr.io/laskav/botnet-account-job:2cfb1a11a64a53fd68dce84fd50eec83112a9128
          env:
            - name: ACCOUNT_ID
              value: "{{ account_id }}"
            - name: API_URL
              value: "http://botnet-api:8080"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: INFINITE
              value: "true"
      restartPolicy: Never