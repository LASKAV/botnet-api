apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ job_name }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: botnet-account-job
          image: ghcr.io/laskav/botnet-account-job:6a54b3838b0406b7e275a192fd31c4fe550d2401
          env:
            - name: ACCOUNT_ID
              value: "{{ account_id }}"
            - name: OWNER_ID
              value: "{{ owner_id }}"
            - name: API_URL
              value: "http://botnet-api:8080"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: INFINITE
              value: "true"
      restartPolicy: Never