name: Quix Manager API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set lowercase repo name
        id: vars
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.REPO_LOWER }}:latest
            ghcr.io/${{ steps.vars.outputs.REPO_LOWER }}:${{ github.sha }}

      - name: Update GitOps repository
        shell: bash
        env:
            GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          # Configure git credential store
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          # Remove any existing gitops directory
          rm -rf gitops

          # Clone GitOps repo
          git clone https://github.com/laskav/gitops.git gitops
          cd gitops
          
          echo "--- BEFORE ---"
          cat Docker-templates/BotNet/api/deployment.yaml

          # --------------  UPDATE IMAGE TAG --------------
          FILE="Docker-templates/BotNet/api/deployment.yaml"
          NEW_TAG="ghcr.io/laskav/kubernetes-quix-api:${GITHUB_SHA}"
        

          
          # # macOS vs Linux in-place edit
          # if [[ "$OSTYPE" == "darwin"* ]]; then
          #   sed -i '' "s|image: ghcr.io/.*/kubernetes-quix-api:.*|image: ${NEW_TAG}|g" "$FILE"
          # else
          #   sed -i "s|image: ghcr.io/.*/kubernetes-quix-api:.*|image: ${NEW_TAG}|g" "$FILE"
          # fi
          
          # Replace image tag using sed (macOS and Linux compatible)
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ghcr.io/.*/kubernetes-cicd-tutorial:.*|image: ghcr.io/laskav/kubernetes-cicd-tutorial:${{ github.sha }}|g" "$FILE"
          else
            sed -i "s|image: ghcr.io/.*/kubernetes-cicd-tutorial:.*|image: ghcr.io/laskav/kubernetes-cicd-tutorial:${{ github.sha }}|g" "$FILE"
          fi

          echo "--- AFTER ---"
          cat "$FILE"


          # --------------  COMMIT & PUSH --------------
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@github.com"


          # Only commit if there are actual changes
          if git diff --quiet; then
            echo "✅ No changes to commit."
          else
            git add "$FILE"
            git commit -m "Update image to ${{ github.sha }}"
            git push -f https://${GIT_TOKEN}@github.com/laskav/gitops.git main
          fi


