name: Quix Manager API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set lowercase repo name
        id: vars
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.REPO_LOWER }}:latest
            ghcr.io/${{ steps.vars.outputs.REPO_LOWER }}:${{ github.sha }}

      - name: Update GitOps repository
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          set -euo pipefail

          # Configure git credential store
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          # -------- settings --------
          REPO_URL="https://github.com/laskav/gitops.git"
          FILE="Docker-templates/BotNet/api/deployment/api-deployment.yaml"
          NEW_TAG="ghcr.io/laskav/botnet-api:${GITHUB_SHA}"

          # -------- clone --------
          rm -rf gitops
          git clone "$REPO_URL" gitops
          cd gitops

          echo "--- BEFORE ---"
          if [[ -f "$FILE" ]]; then
            cat "$FILE"
          else
            echo "❌ File not found: $FILE"
            exit 1
          fi

          # -------- replace image tag --------
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ghcr.io/.*/botnet-api:.*|image: ${NEW_TAG}|g" "$FILE"
          else
            sed -i    "s|image: ghcr.io/.*/botnet-api:.*|image: ${NEW_TAG}|g" "$FILE"
          fi

          echo "--- AFTER ---"
          cat "$FILE"

          # -------- commit & push --------
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@github.com"

          if git diff --quiet; then
            echo "✅ No changes to commit."
          else
            git add "$FILE"
            git commit -m "Update image to ${GITHUB_SHA}"
            git push "https://x-access-token:${GIT_TOKEN}@github.com/laskav/gitops.git" main
          fi
